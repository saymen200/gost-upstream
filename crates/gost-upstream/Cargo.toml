[package]
name = "gost-upstream"
version = "1.0.1"
edition = "2024"
license = "MIT"
description = "GOST TLS upstream proxy — plug a GOST-TLS leg into Burp Suite (or any tool with upstream-proxy support) without it ever touching GOST crypto."

[[bin]]
name = "gost-upstream"
path = "src/main.rs"

[dependencies]
proxy = { path = "../proxy" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
